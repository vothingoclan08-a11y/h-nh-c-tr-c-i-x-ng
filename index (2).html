*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg);font-size:18px;line-height:1.55}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{cursor:default;opacity:.55}button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #edaa00;outline-offset:4px}button{min-height:46px}a{color:var(--blue)}.skip{position:fixed;top:-80px;left:12px;background:white;padding:12px;z-index:20}.skip:focus{top:10px}.wrap{max-width:1180px;margin:auto;padding:0 24px}.masthead{background:var(--navy);color:white;padding:20px 0}.brand{display:flex;align-items:center;gap:15px}.mark{font-size:28px;border:2px solid #98bafd;width:48px;height:48px;display:grid;place-items:center;border-radius:50%}.brand h1{font-size:28px;margin:0;line-height:1.2}.brand p{font-size:15px;margin:4px 0 0;color:#d9e7ff}.nav-shell{background:white;border-bottom:1px solid var(--line)}.steps{display:flex;gap:6px;padding:12px 0;list-style:none;margin:0;flex-wrap:wrap}.steps li{flex:1;min-width:145px}.step{width:100%;border:0;border-radius:8px;background:transparent;color:var(--muted);padding:12px 10px;display:flex;align-items:center;gap:9px;text-align:left;font-size:16px;font-weight:bold}.step.active{background:var(--blue);color:white}.step .number{border:1px solid currentColor;border-radius:50%;min-width:27px;height:27px;display:grid;place-items:center;font-size:14px}.step.done .number{background:var(--green);color:white;border-color:var(--green)}.step.active.done .number{background:white;color:var(--blue);border-color:white}main{padding:28px 0 46px}h2{color:var(--navy);font-size:32px;line-height:1.2;margin:0 0 12px}h3{font-size:22px;line-height:1.3;color:var(--navy);margin:0 0 12px}p{margin:0 0 14px}.eyebrow{font-size:14px;text-transform:uppercase;letter-spacing:.08em;font-weight:bold;color:var(--blue);margin-bottom:7px}.intro{max-width:850px;margin-bottom:22px}.work{display:grid r:var(--green);color:#0c583d}.feedback.retry{background:#fff0f1;border-color:var(--red);color:#83203b}.feedback:empty{display:none}.hint{font-size:16px;color:var(--muted)}.callout{background:#fff6d9;border-left:4px solid #ddaa25;border-radius:8px;padding:16px;margin:18px 0}.knowledge{padding:20px;border-top:2px solid var(--blue);margin-top:24px;background:white}.knowledge strong{color:var(--blue)}.controls{margin-top:16px;display:grid;gap:14px}.control label{display:flex;justify-content:space-between;gap:15px;font-weight:bold;font-size:16px}.control input[type=range]{width:100%;height:34px;accent-color:var(--blue)}.range-wrap{display:flex;align-items:center;gap:12px}.range-wrap input[type=number]{width:83px;border:1px solid #b8c9df;border-radius:7px;padding:5px;font-size:16px}.shape-list{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.shape-btn{border:1px solid var(--line);background:white;color:var(--ink);padding:9px 13px;border-radius:8px;font-size:16px}.shape-btn.active{background:var(--navy);color:white;border-color:var(--navy)}.shape-btn.complete::after{content:' ✓';color:#147950;font-weight:bold}.shape-btn.complete.active::after{color:#9cf1c7}.mini-table{width:100%;border-collapse:collapse;font-size:16px;margin:14px 0}.mini-table th,.mini-table td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line)}.mini-table th{color:var(--blue)}.answer-count{font-weight:bold;color:var(--blue);font-size:20px}.statement{font-size:24px;font-weight:bold;line-height:1.45;color:var(--navy);margin:10px 0 20px}.subnav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.dot-btn{border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink);min-width:46px;padding:8px 12px;font-weight:bold}.dot-btn.active{background:var(--blue);color:white;border-color:var(--blue)}.dot-btn.done{border-color:var(--green);box-shadow:inset 0 -4px var(--green)}.art-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0}.art-option{background:white;border:2px solid var(--line);border-radius:12px;padding:10px;color:var(--ink);text-align:left;min-width:0}.art-option.selected{border-color:var(--blue);background:var(--pale)}.art-option svg{width:100%;display:block}.art-option strong{display:block;font-size:17px;text-align:center}.score{font-size:70px;line-height:1.1;font-weight:bold;color:var(--blue);margin:12px 0}.review-item{border-top:1px solid var(--line);padding:18px 0}.review-item h3{font-size:19px}.pill{display:inline-block;font-size:14px;font-weight:bold;padding:3px 8px;border-radius:5px;background:#edf8f1;color:var(--green)}.pill.wrong{background:#fff0f1;color:var(--red)}.review-item svg{max-width:420px;max-height:250px;display:block;margin:10px auto}.footer{background:white;border-top:1px solid var(--line);color:var(--muted);padding:20px 0;font-size:15px}.footer p{margin:0}details{margin-top:18px}summary{cursor:pointer;font-weight:bold;color:var(--blue)}.endnav{display:flex;justify-content:space-between;gap:14px;margin-top:28px}.nowrap{white-space:nowrap}.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}noscript{display:block;padding:20px;background:#fff6d9}.small{font-size:15px}.stage-progress{font-size:15px;color:var(--muted);margin-top:8px}.quiz-info{display:flex;gap:18px;flex-wrap:wrap;font-size:16px;color:var(--muted);margin:10px 0}.quiz-option-img{width:100%;max-width:260px}.lab-summary{margin-top:24px}.lab-summary td:last-child{font-weight:bold;color:var(--blue)}

<main id="main" class="wrap"></main>
<noscript>Em cần bật JavaScript trong trình duyệt để sử dụng mô phỏng và làm bài tập.</noscript>
<footer class="footer"><div class="wrap"><p>Hãy dự đoán trước, gấp kiểm tra sau và giải thích điều em quan sát được.</p></div></footer>
<script>
'use strict';
const $=s=>document.querySelector(s);
const EPS=1e-7;
const polygon=(n,r,start=0)=>Array.from({length:n},(_,i)=>{const a=(start+i*360/n)*Math.PI/180;return [r*Math.cos(a),r*Math.sin(a)];});
const box=(x,y,w,h)=>[[x,y],[x+w,y],[x+w,y+h],[x,y+h]];
const disk=(x,y,r,n=72)=>polygon(n,r).map(p=>[p[0]+x,p[1]+y]);
const shapes={
 rectangle:{name:'Hình chữ nhật',full:'Hình chữ nhật không phải hình vuông',points:box(-150,-90,300,180),axes:[0,90],count:2,explain:'Hai trục đi qua trung điểm các cặp cạnh đối diện. Đường thẳng chứa đường chéo không phải trục của hình chữ nhật này.'},
 square:{name:'Hình vuông',full:'Hình vuông',points:box(-110,-110,220,220),axes:[0,45,90,135],count:4,explain:'Hai trục qua trung điểm các cặp cạnh đối diện và hai trục chứa các đường chéo.'},
 rhombus:{name:'Hình thoi',full:'Hình thoi không phải hình vuông',points:[[0,-120],[165,0],[0,120],[-165,0]],axes:[0,90],count:2,explain:'Hai đường thẳng chứa các đường chéo là hai trục đối xứng của hình thoi này.'},
 triangle:{name:'Tam giác đều',full:'Tam giác đều',points:polygon(3,130,-90),axes:[30,90,150],count:3,explain:'Mỗi trục đi qua một đỉnh và trung điểm cạnh đối diện.'},
 hexagon:{name:'Lục giác đều',full:'Lục giác đều',points:polygon(6,130),axes:[0,30,60,90,120,150],count:6,explain:'Ba trục qua các cặp đỉnh đối diện, ba trục qua trung điểm các cặp cạnh đối diện.'},
 circle:{name:'Hình tròn',full:'Hình tròn',points:disk(0,0,120,144),axes:null,count:Infinity,explain:'Mọi đường thẳng đi qua tâm đều là trục đối xứng. Có vô số đường như vậy.'},
 parallelogram:{name:'Hình bình hành',full:'Hình bình hành không có góc vuông, cạnh kề không bằng nhau',points:[[-160,-85],[95,-85],[160,85],[-95,85]],axes:[],count:0,explain:'Hình bình hành này không có góc vuông, cạnh kề không bằng nhau nên không có trục đối xứng. Hình chữ nhật và hình thoi là các trường hợp đặc biệt cần xét riêng.'}
};
const shapeIds=Object.keys(shapes);
const stageNames=['Khám phá','Tìm các trục','Bắt lỗi','Khôi phục hình','Thử thách'];
const state={stage:0,done:[false,false,false,false,false],anim:0,busy:false,fold:0,live:null,
 intro:{line:0,pred:null,tests:[null,null,null],message:'',definition:false},
 lab:{id:'square',angle:90,offset:0,predictions:{},found:Object.fromEntries(shapeIds.map(id=>[id,[]])),tested:{},complete:{},message:'',passed:false,foldKey:null},
 myth:{index:0,answered:[false,false,false,false],why:[false,false,false,false],message:''},
 art:{index:0,axis:[false,false,false],restore:[false,false,false],message:'',angle:90},
 quiz:{index:0,selected:Array.from({length:10},()=>[]),answers:Array(10).fill(null),finished:false}};
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function axisData(angle,offset=0){const a=angle*Math.PI/180;const u=[Math.cos(a),Math.sin(a)],n=[-u[1],u[0]];return {u,n,c:[n[0]*offset,n[1]*offset]};}
function signed(p,n,offset){return p[0]*n[0]+p[1]*n[1]-offset;}
function clipHalf(points,n,offset,positive){
 const out=[]; if(!points.length)return out;
 for(let i=0;i<points.length;i++){const a=points[i],b=points[(i+1)%points.length],da=signed(a,n,offset),db=signed(b,n,offset);const ia=positive?da>=-EPS:da<=EPS,ib=positive?db>=-EPS:db<=EPS;
  if(ia)out.push(a);if(ia!==ib){const t=da/(da-db);out.push([a[0]+t*(b[0]-a[0]),a[1]+t*(b[1]-a[1])]);}}
 return out;
}
function foldPoint(p,angle,offset,t){const {n}=axisData(angle,offset);const d=signed(p,n,offset),factor=1-Math.cos(Math.PI*t);return [p[0]-n[0]*d*factor,p[1]-n[1]*d*factor];}
const angleDistance=(a,b)=>Math.min(Math.abs(((a-b)%180+180)%180),180-Math.abs(((a-b)%180+180)%180));
function validAxis(shape,angle,offset=0){return Math.abs(offset)<EPS&&(shape.axes===null||shape.axes.some(a=>angleDistance(a,angle)<EPS));}
function polyPath(p){return p.length>=3?'M'+p.map(x=>x.map(v=>Number(v.toFixed(3))).join(',')).join('L')+'Z':'';}
function partsFor(shape){return shape.parts||[{points:shape.points,fill:'#dce9ff'}];}
function pathGroup(parts,extra=''){return parts.map(p=>`<path d="${polyPath(p.points)}" fill="${p.fill||'#dce9ff'}" stroke="#18345b" stroke-width="1.8" ${extra}/>`).join('');}
function axisLine(angle,offset=0,color='#e27224',label='',dash='7 5'){
 const {u,c}=axisData(angle,offset),p=[c[0]-u[0]*400,c[1]-u[1]*400],q=[c[0]+u[0]*400,c[1]+u[1]*400];
 const labelP=[c[0]+u[0]*145,c[1]+u[1]*145];
 return `<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="${color}" stroke-width="2.5" stroke-dasharray="${dash}"/>${label?`<g transform="translate(${labelP[0]},${labelP[1]})"><circle r="13" fill="white" stroke="${color}"/><text text-anchor="middle" dominant-baseline="central" fill="${color}" font-size="16" font-family="Arial" font-weight="bold">${label}</text></g>`:''}`;
}
function diagram(shape,angle=90,offset=0,t=0,pinned=[],opts={}){
 const parts=partsFor(shape),{n}=axisData(angle,offset);const staticParts=parts.map(p=>({...p,points:clipHalf(p.points,n,offset,false)}));const moving=parts.map(p=>({...p,points:clipHalf(p.points,n,offset,true).map(v=>foldPoint(v,angle,offset,t))}));
 const fullD=parts.map(p=>polyPath(p.points)).join(' '),movingD=moving.map(p=>polyPath(p.points)).join(' ');
 const good=validAxis(shape,angle,offset);const id='m'+Math.random().toString(36).slice(2,10);
 const svg=`<svg viewBox="-230 -180 460 360" role="img" aria-label="${escapeHTML(opts.label||shape.full||shape.name)}${t===1?good?', hai phần chồng khít khi gấp':', hai phần chưa chồng khít khi gấp':''}" xmlns="http://www.w3.org/2000/svg">
 <defs><pattern id="${id}stripe" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fff0f1"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c73251" stroke-width="3"/></pattern><mask id="${id}outside"><rect x="-230" y="-180" width="460" height="360" fill="white"/><path d="${fullD}" fill="black"/></mask><mask id="${id}uncovered"><rect x="-230" y="-180" width="460" height="360" fill="white"/><path d="${movingD}" fill="black"/></mask></defs>
 <path d="${fullD}" fill="#eef3fc" stroke="#19345b" stroke-width="2"/>${t>0?pathGroup(staticParts):pathGroup(parts)}
 ${t>0?moving.map(p=>`<path d="${polyPath(p.points)}" fill="#a878df" fill-opacity=".6" stroke="#7742b0" stroke-width="1.8"/>`).join(''):''}
 ${t>.999&&!good?`<g mask="url(#${id}outside)"><path d="${movingD}" fill="url(#${id}stripe)"/></g><g mask="url(#${id}uncovered)">${staticParts.map(p=>`<path d="${polyPath(p.points)}" fill="url(#${id}stripe)"/>`).join('')}</g>`:''}
 ${pinned.map(a=>axisLine(a,0,'#1556c0','','5 4')).join('')}
 ${opts.axes?opts.axes.map((x,i)=>axisLine(x.angle,x.offset||0,x.color||'#1556c0',x.label||String.fromCharCode(65+i))).join(''):opts.noAxis?'':axisLine(angle,offset)}
 ${shape.axes===null?'<circle cx="0" cy="0" r="3" fill="#18345b"/><text x="8" y="-7" font-size="16" fill="#18345b" font-family="Arial">O</text>':''}
 </svg>`;
 return svg;
}
const legend=()=>'<div class="legend"><span><i class="swatch" aria-hidden="true"></i>Hình ban đầu</span><span><i class="swatch purple" aria-hidden="true"></i>Phần đang gấp</span><span><i class="swatch red" aria-hidden="true"></i>Phần chưa chồng khít</span></div>';
function figure(shape,angle=90,offset=0,t=0,pinned=[],opts={}){return `<div class="diagram" id="foldDiagram">${diagram(shape,angle,offset,t,pinned,opts)}</div>${legend()}`;}
function feedback(message,type=''){return message?`<div class="feedback ${type}" role="status">${message}</div>`:'';}
function navButtons(){return `<div class="endnav">${state.stage>0?'<button class="btn secondary" data-action="previous">Chặng trước</button>':'<span></span>'}${state.stage<4?'<button class="btn" data-action="next">Chặng tiếp theo</button>':''}</div>`;}
function introHeading(n,title,desc){return `<div class="intro"><p class="eyebrow">Chặng ${n} / 5</p><h2 tabindex="-1">${title}</h2><p>${desc}</p></div>`;}
const introLines=[{angle:90,name:'A. Qua trung điểm hai cạnh trên và dưới',good:true},{angle:0,name:'B. Qua trung điểm hai cạnh trái và phải',good:true},{angle:Math.atan2(180,300)*180/Math.PI,name:'C. Đường thẳng chứa một đường chéo',good:false}];
function renderIntro(){const st=state.intro,l=introLines[st.line];

function quizFigure(q,showCorrect=false){if(q.art)return `<div class="diagram">${restoreSVG(artShapes[2])}</div>`;let axes=q.lines||[];if(showCorrect&&!q.lines)axes=shapes[q.shape].axes?.map(angle=>({angle}))||[];return `<div class="diagram">${diagram(shapes[q.shape],90,0,0,[],{noAxis:true,axes})}</div>`;}
function renderQuiz(){const st=state.quiz;if(st.finished)return renderResults();const q=quizzes[st.index],selection=st.selected[st.index],answer=st.answers[st.index];
 return introHeading(5,'Thử thách cuối cùng','10 câu, mỗi câu 1 điểm. Em có thể chọn câu bất kỳ. Mỗi câu tính điểm theo lần kiểm tra đầu tiên.')+`<div class="subnav" aria-label="Chọn câu hỏi">${quizzes.map((_,i)=>`<button class="dot-btn ${i===st.index?'active':''} ${st.answers[i]!==null?'done':''}" data-action="quiz-index" data-value="${i}" aria-label="Câu ${i+1}${st.answers[i]!==null?', đã trả lời':''}">${i+1}</button>`).join('')}</div><div class="quiz-info"><span>Đã trả lời: ${st.answers.filter(x=>x!==null).length}/10</span><span>${q.multi?'Câu này có nhiều đáp án đúng.':'Câu này có một đáp án đúng.'}</span></div><div class="work"><section class="paper">${quizFigure(q)}${q.art?restoreChoices(artShapes[2],'quiz-choice',selection[0]??-1):''}</section><section class="paper"><p class="eyebrow">Câu ${st.index+1} / 10</p><h3>${q.q}</h3>${q.art?'':`<div class="choices">${q.options.map((x,i)=>`<button class="choice ${q.multi?'multi':''} ${selection.includes(i)?'selected':''}" data-action="quiz-choice" data-value="${i}" aria-pressed="${selection.includes(i)}" ${answer!==null?'disabled':''}><span class="indicator">${selection.includes(i)?'✓':''}</span><span>${x}</span></button>`).join('')}</div>`}<div class="actions"><button class="btn" data-action="quiz-check" ${selection.length===0||answer!==null?'disabled':''}>Kiểm tra câu trả lời</button>${st.index<9?'<button class="btn secondary" data-action="quiz-next">Câu tiếp theo</button>':''}</div>${answer!==null?feedback(`<strong>${answer.correct?'Đúng! Em nhận được 1 điểm.':'Câu này chưa đúng.'}</strong><br>${q.explain}`,answer.correct?'success':'retry'):''}<p class="hint" style="margin-top:16px">Sau khi kiểm tra, câu trả lời được giữ để tính điểm. Em có thể làm lại toàn bộ thử thách ở cuối bài.</p></section></div><div class="actions"><button class="btn" data-action="quiz-finish">Kết thúc và xem kết quả</button></div>`;
}
function renderResults(){const st=state.quiz,score=st.answers.filter(a=>a?.correct).length;
 return introHeading(5,'Kết quả của em','Xem lại những câu cần luyện thêm, rồi thử gấp để kiểm tra điều em còn phân vân.')+`<section class="paper"><div class="score">${score}<span style="font-size:32px"> / 10</span></div><p>${score===10?'Em đã hoàn thành cả 10 câu chính xác. Hãy thử giải thích cách kiểm tra trục đối xứng cho một bạn.':score>=7?'Em đã nhận biết được nhiều trường hợp. Hãy xem lời giải của những câu chưa đúng bên dưới.':'Em hãy ôn lại điều kiện hai phần chồng khít khi gấp, rồi thử lại các câu bên dưới.'}</p><div class="actions"><button class="btn" data-action="quiz-retry">Làm lại thử thách</button><button class="btn secondary" data-action="review-lab">Ôn lại bằng mô phỏng</button></div><div class="knowledge"><strong>Kiến thức cần nhớ</strong><p>Trục đối xứng là đường thẳng mà khi gấp hình theo đường đó, hai phần chồng khít lên nhau.</p></div><h3 style="margin-top:24px">Xem lại từng câu</h3>${quizzes.map((q,i)=>{const a=st.answers[i];return `<article class="review-item"><span class="pill ${a?.correct?'':'wrong'}">${a?.correct?'Đúng':a?'Cần xem lại':'Chưa trả lời'}</span><h3 style="margin-top:8px">Câu ${i+1}. ${q.q}</h3><p class="small">Em chọn: ${a?a.selected.map(v=>q.options[v]).join(', '):'Chưa chọn'}.<br><strong>Đáp án: ${q.correct.map(v=>q.options[v]).join(', ')}.</strong></p>${!a?.correct?quizFigure(q,true):''}<p>${q.explain}</p></article>`;}).join('')}</section>`;
}
function render(focus=false){state.anim++;state.busy=false;$('#steps').innerHTML=stageNames.map((name,i)=>`<li><button class="step ${state.stage===i?'active':''} ${state.done[i]?'done':''}" data-action="stage" data-value="${i}" ${state.stage===i?'aria-current="step"':''}><span class="number">${state.done[i]?'✓':i+1}</span>${name}</button></li>`).join('');$('#main').innerHTML=[renderIntro,renderLab,renderMyth,renderArt,renderQuiz][state.stage]();if(focus){$('#main h2')?.focus({preventScroll:true});window.scrollTo({top:0,behavior:'auto'});}}
function setStage(n){state.stage=Math.max(0,Math.min(4,n));state.fold=0;render(true);}
function liveFigure(){if(state.stage===0){const l=introLines[state.intro.line];return {shape:shapes.rectangle,angle:l.angle,offset:0,pinned:[]};}if(state.stage===1){const st=state.lab;return {shape:shapes[st.id],angle:st.angle,offset:st.offset,pinned:st.found[st.id]};}if(state.stage===2){const m=myths[state.myth.index];return {shape:shapes[m.shape],angle:m.angle,offset:0,pinned:[],opts:state.myth.answered[state.myth.index]&&m.axes?{axes:m.axes.map(angle=>({angle}))}:{}};}if(state.stage===3)return {shape:artShapes[state.art.index],angle:state.art.angle,offset:0,pinned:[]};return null;}
function drawLive(){const f=liveFigure();if(f&&$('#foldDiagram'))$('#foldDiagram').innerHTML=diagram(f.shape,f.angle,f.offset,state.fold,f.pinned,f.opts||{});}
function animateFold(onEnd){const token=++state.anim;state.busy=true;const start=performance.now(),duration=window.matchMedia('(prefers-reduced-motion: reduce)').matches?0:1050;const f=liveFigure();if(!f){state.busy=false;return;}document.querySelectorAll('[data-action$="-fold"],[data-action="open"],[data-action="lab-keep"]').forEach(b=>b.disabled=true);
 function frame(now){if(token!==state.anim)return;state.fold=duration?Math.min(1,(now-start)/duration):1;drawLive();if(state.fold<1)requestAnimationFrame(frame);else{state.busy=false;if(onEnd)onEnd();else render();}}
 requestAnimationFrame(frame);
}
function foldIntro(){const st=state.intro;if(st.pred===null)return;const l=introLines[st.line];animateFold(()=>{const predicted=st.pred===l.good;st.tests[st.line]=l.good;st.message=`${predicted?'Dự đoán của em phù hợp.':'Em hãy đối chiếu lại dự đoán.'} ${l.good?'Hai phần chồng khít khi gấp. Đường này là một trục đối xứng.':'Quan sát phần sọc đỏ: hai phần chưa chồng khít. Đường chứa đường chéo không phải trục của hình chữ nhật này.'}`;render();});}
function foldLab(){const st=state.lab;animateFold(()=>{st.passed=validAxis(shapes[st.id],st.angle,st.offset);st.foldKey=st.id+':'+st.angle+':'+st.offset;st.tested[st.id]=(st.tested[st.id]||0)+1;st.message=st.passed?'Hai phần chồng khít! Nhấn “Giữ trục đã tìm được”, rồi tiếp tục thử hướng khác.':'Hai phần chưa chồng khít. Quan sát phần sọc đỏ và thử thay đổi hướng hoặc vị trí đường thẳng.';render();});}
function keepAxis(){const st=state.lab;if(!st.passed||state.fold!==1||st.foldKey!==st.id+':'+st.angle+':'+st.offset)return;const found=st.found[st.id];if(found.some(a=>angleDistance(a,st.angle)<EPS)){st.message='Trục này đã được giữ. Hãy tìm một hướng khác.';render();return;}found.push(st.angle);const s=shapes[st.id];if(s.count!==Infinity&&found.length===s.count){st.complete[st.id]=true;st.message='Em đã tìm đủ '+s.count+' trục của hình này. '+s.explain;}else st.message='Đã giữ trục. Hãy thử tìm thêm trục khác.';state.done[1]=shapeIds.every(id=>st.complete[id]);render();}
function checkQuiz(){const st=state.quiz,i=st.index;if(st.answers[i]!==null||!st.selected[i].length)return;st.answers[i]={selected:[...st.selected[i]],correct:sameSet(st.selected[i],quizzes[i].correct)};render();}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,v=b.dataset.value;switch(a){
case 'stage':setStage(Number(v));break;case 'next':setStage(state.stage+1);break;case 'previous':setStage(state.stage-1);break;
case 'open':state.anim++;state.busy=false;state.fold=0;if(state.stage===1)state.lab.passed=false;render();break;
case 'intro-line':state.intro.line=Number(v);state.intro.pred=null;state.intro.message='';state.fold=0;render();break;
case 'intro-predict':state.intro.pred=v==='true';state.intro.message='';state.fold=0;render();break;
case 'intro-fold':foldIntro();break;
case 'definition':if(v==='1'){state.intro.definition=true;state.done[0]=true;state.intro.message='Đúng! Điều kiện cần kiểm tra là hai phần chồng khít khi gấp.';}else state.intro.message='Diện tích bằng nhau chưa đủ. Hãy nhớ điều em đã thấy khi gấp theo đường chéo.';render();break;
case 'lab-shape':state.lab.id=v;state.lab.angle=90;state.lab.offset=0;state.lab.passed=false;state.lab.message='';state.fold=0;render();break;
case 'lab-fold':foldLab();break;case 'lab-keep':keepAxis();break;
case 'lab-none':if((state.lab.tested.parallelogram||0)<2){state.lab.message='Em hãy thử gấp theo ít nhất hai hướng khác nhau, rồi đối chiếu với kết luận.';}else{state.lab.complete.parallelogram=true;state.lab.message=shapes.parallelogram.explain;state.done[1]=shapeIds.every(id=>state.lab.complete[id]);}render();break;
case 'circle-conclusion':if(v==='1'){state.lab.complete.circle=true;state.lab.message=shapes.circle.explain;state.done[1]=shapeIds.every(id=>state.lab.complete[id]);}else state.lab.message='Em hãy tiếp tục đổi hướng một đường thẳng qua tâm. Các phép gấp đều làm hai phần chồng khít.';render();break;
case 'myth-index':state.myth.index=Number(v);state.myth.message='';state.fold=0;render();break;
case 'myth-fold':animateFold();break;
case 'myth-answer':if(v==='false'){state.myth.answered[state.myth.index]=true;state.myth.message='Em đã nhận ra nhận định chưa đúng. Hãy chọn lời giải thích phù hợp.';}else state.myth.message='Hãy gấp để quan sát và kiểm tra lại nhận định.';render();break;
case 'myth-why':if(Number(v)===myths[state.myth.index].correct){state.myth.why[state.myth.index]=true;state.myth.message='Lời giải thích phù hợp!';state.done[2]=state.myth.why.every(Boolean);}else state.myth.message='Lời giải thích này chưa phù hợp. Hãy kiểm tra điều kiện hai phần chồng khít khi gấp.';render();break;
case 'art-index':state.art.index=Number(v);state.art.angle=90;state.art.message='';state.fold=0;render();break;
case 'art-axis':state.art.angle=Number(v);state.art.message='';state.fold=0;render();break;
case 'art-fold':animateFold(()=>{const st=state.art,good=validAxis(artShapes[st.index],st.angle);if(good){st.axis[st.index]=true;st.message='Hai phần chồng khít. Em đã tìm được trục! Hãy khôi phục phần còn thiếu.';}else st.message='Đường này chưa làm hai phần chồng khít. Em thử một hướng khác nhé.';render();});break;
case 'art-restore':{const st=state.art,type=artShapes[st.index].order[Number(v)];if(!st.axis[st.index])break;if(type==='reflect'){st.restore[st.index]=true;st.message='Đúng! Phần được chọn phản chiếu đúng qua trục d.';state.done[3]=st.restore.every(Boolean);}else st.message=type==='translate'?'Phần này chỉ dịch chuyển sang bên cạnh. Hướng các chi tiết chưa phù hợp khi gấp.':'Một chi tiết hoặc đường bao bị lệch. Em hãy quan sát kỹ hai bên trục.';render();break;}
case 'quiz-index':state.quiz.index=Number(v);render();break;
case 'quiz-choice':{const st=state.quiz,i=st.index;if(st.answers[i]!==null)break;const n=Number(v),selected=st.selected[i];st.selected[i]=quizzes[i].multi?(selected.includes(n)?selected.filter(x=>x!==n):[...selected,n]):[n];render();break;}
case 'quiz-check':checkQuiz();break;case 'quiz-next':state.quiz.index=Math.min(9,state.quiz.index+1);render();break;
case 'quiz-finish':{const left=state.quiz.answers.filter(a=>a===null).length;if(left&&!window.confirm(`Còn ${left} câu chưa được kiểm tra. Các câu này tính 0 điểm. Em muốn kết thúc không?`))break;state.quiz.finished=true;state.done[4]=true;render(true);break;}
case 'quiz-retry':state.quiz={index:0,selected:Array.from({length:10},()=>[]),answers:Array(10).fill(null),finished:false};state.done[4]=false;render(true);break;
case 'review-lab':setStage(1);break;
}});
document.addEventListener('input',e=>{const key=e.target.dataset.control;if(!key)return;const st=state.lab,value=Number(e.target.value);if(!Number.isFinite(value))return;state.anim++;state.busy=false;st[key]=Math.round(Math.max(key==='angle'?0:-155,Math.min(key==='angle'?179:155,value)));state.fold=0;st.passed=false;st.foldKey=null;st.message='';const prefix=key==='angle'?'angle':'offset';document.getElementById(prefix+'Range').value=st[key];document.getElementById(prefix+'Number').value=st[key];document.getElementById(prefix+'Value').textContent=st[key]+(key==='angle'?'°':'');$('#labFeedback').innerHTML='';$('#keepAxis').disabled=true;drawLive();document.querySelectorAll('[data-action="lab-fold"],[data-action="open"]').forEach(b=>b.disabled=b.dataset.action==='lab-fold'&&st.predictions[st.id]===undefined);});
document.addEventListener('change',e=>{if(e.target.id==='labPrediction'){const st=state.lab;if(e.target.value==='')delete st.predictions[st.id];else st.predictions[st.id]=e.target.value;const b=document.querySelector('[data-action="lab-fold"]');if(b)b.disabled=st.predictions[st.id]===undefined;}});
render();
</script>
</body>
</html>
